<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raagly - Vedic Raag Remedies</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body id="app-body">
    <div class="player-container">
        <h1 class="title">Raagly</h1>
        <p class="subtitle">Sound Healing & Frequencies</p>

        <!-- Search Bar for Illness / Benefits -->
        <div class="search-container">
            <input type="text" id="search-input" placeholder="🔍 Search illness (e.g. Headache, Asthma)..." autocomplete="off">
            <ul id="search-results" class="search-results-list"></ul>
        </div>

        <!-- Mandala Animation -->
        <div class="art-container">
            <div class="mandala-circle"></div>
        </div>

        <h2 id="raag-name">Loading Raags...</h2>
        <p id="raag-time">Tap Play to Listen</p>

        <!-- Healing Benefits / Description Box -->
        <div class="description-container">
            <p id="raag-desc">Select or play a track to view healing benefits...</p>
        </div>

        <!-- Working Progress Seek Bar -->
        <div id="progress-container" class="progress-container">
            <div id="progress" class="progress"></div>
        </div>
        <div class="time-display">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>

        <!-- Media Controls -->
        <div class="controls">
            <button id="prev" class="action-btn"><i class="fas fa-backward"></i></button>
            <button id="play" class="action-btn play-btn"><i class="fas fa-play"></i></button>
            <button id="next" class="action-btn"><i class="fas fa-forward"></i></button>
        </div>

        <!-- Volume Controls Panel -->
        <div class="volume-container">
            <button id="mute-btn" class="action-btn"><i class="fas fa-volume-up"></i></button>
            <input type="range" id="volume-slider" min="0" max="100" value="80">
        </div>
    </div>

    <!-- Hidden YouTube Player Container -->
    <div id="youtube-player" class="hidden-player"></div>

    <script src="script.js"></script>
</body>
</html>
