<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#180A29">

    <meta name="description"
          content="RAAGLY — Vedic sound astronomy, classical raag exploration, and the mathematics of time.">
    <title>RAAGLY — Sound Beyond Silence</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?fontfamily=Merriweather:wght@300;400;700;900&family=Inter:wght@300;400;500;600&display=swap"
          rel="stylesheet">
</head>

<body id="app-body">

    <!-- Vedic Geometry Header -->
    <header class="topbar">

        <div class="brand">
            <span class="brand-mark">○</span>

            <div>
                <h1>RAAGLY</h1>
                <span>sound beyond silence</span>
            </div>
        </div>

        <button id="nav-toggle"
                class="icon-button"
                aria-label="Open navigation">
            <i class="fa-solid fa-bars"></i>
        </button>

    </header>


    <!-- Main Navigation -->
    <nav id="main-nav" class="nav-primary">

        <ul>
            <li>
                <a href="#" class="nav-item active"
                   data-section="explore"
                   aria-label="Explore raags">
                    Explore
                </a>
            </li>

            <li>
                <a href="#" class="nav-item"
                   data-section="library"
                   aria-label="Raag library">
                    Library
                </a>
            </li>

            <li>
                <a href="#" class="nav-item"
                   data-section="player"
                   aria-label="Player">
                    Listen
                </a>
            </li>
        </ul>

    </nav>


    <main class="app">

        <!-- Quick Filters -->
        <section class="quick-section">

            <div class="section-heading">

                <div>
                    <span>EXPLORE</span>
                    <h3>Find your raag</h3>
                </div>

                <button id="show-all"
                        class="text-button">
                    View all
                </button>

            </div>


            <div class="filter-row">

                <button class="filter active"
                        data-filter="all">
                    All
                </button>

                <button class="filter"
                        data-filter="health">
                    Health
                </button>

                <button class="filter"
                        data-filter="mind">
                    Mind
                </button>

                <button class="filter"
                        data-filter="career">
                    Career
                </button>

                <button class="filter"
                        data-filter="relationships">
                    Harmony
                </button>

            </div>


            <div id="raag-grid"
                 class="raag-grid">
            </div>

        </section>


        <!-- Player Card -->
        <section class="player-card">

            <!-- Visualizer -->
            <div class="visual-stage">

                <div class="orbit orbit-one"></div>
                <div class="orbit orbit-two"></div>

                <div class="mandala">

                    <div class="mandala-ring ring-one"></div>
                    <div class="mandala-ring ring-two"></div>
                    <div class="mandala-ring ring-three"></div>

                    <div class="mandala-core">
                        <span>○</span>
                    </div>

                </div>

                <div class="sound-bars" id="sound-bars">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>

            </div>


            <!-- Track Information -->
            <div class="track-info">

                <div class="eyebrow">
                    <span class="live-dot"></span>
                    <span id="status-text">READY TO LISTEN</span>
                </div>

                <h2 id="raag-name">Loading Raag...</h2>

                <p id="raag-time">
                    Sound Healing Frequencies
                </p>

                <div class="description-container">

                    <p id="raag-desc">
                        Select a Raag and enter the sound.
                    </p>

                </div>

            </div>


            <!-- Progress -->
            <div class="progress-area">

                <div id="progress-container"
                     class="progress-container"
                     role="slider"
                     aria-label="Seek">

                    <div id="progress"
                         class="progress"></div>

                    <div id="progress-thumb"
                         class="progress-thumb"></div>

                </div>

                <div class="time-display">

                    <span id="current-time">0:00</span>

                    <span id="duration">0:00</span>

                </div>

            </div>


            <!-- Controls -->
            <div class="controls">

                <button id="prev"
                        class="control-button"
                        aria-label="Previous Raag">

                    <i class="fa-solid fa-backward-step"></i>

                </button>


                <button id="play"
                        class="play-button"
                        aria-label="Play">

                    <i class="fa-solid fa-play"></i>

                </button>


                <button id="next"
                        class="control-button"
                        aria-label="Next Raag">

                    <i class="fa-solid fa-forward-step"></i>

                </button>

            </div>


            <!-- Volume -->
            <div class="volume-container">

                <button id="mute-btn"
                        class="volume-button"
                        aria-label="Mute">

                    <i class="fa-solid fa-volume-high"></i>

                </button>

                <input
                    id="volume-slider"
                    type="range"
                    min="0"
                    max="100"
                    value="75"
                    aria-label="Volume"
                >

                <span id="volume-value">75</span>

            </div>


            <!-- Mini Player Info -->
            <div class="player-footer">

                <span>
                    <i class="fa-solid fa-headphones"></i>
                    RAAGLY
                </span>

                <span id="track-counter">
                    01 / 27
                </span>

            </div>

        </section>


        <!-- Library Drawer -->
        <aside id="library"
               class="library">

            <div class="library-header">

                <div>
                    <span>RAAGLY</span>
                    <h2>Raag Library</h2>
                </div>

                <button id="library-close"
                        class="icon-button"
                        aria-label="Close library">

                    <i class="fa-solid fa-xmark"></i>

                </button>

            </div>


            <div id="library-list"
                 class="library-list">
            </div>

        </aside>


        <div id="overlay"
             class="overlay">
        </div>


        <!-- Hidden YouTube Player -->
        <div id="youtube-player"
             class="hidden-player">
        </div>


        <!-- YouTube API -->
        <script src="https://www.youtube.com/iframe_api"></script>

        <!-- Main JS -->
        <script src="script.js"></script>

    </main>


    <footer>
        <span>RAAGLY</span>
        <span>•</span>
        <span>LISTEN · BREATHE · BE</span>
    </footer>

</body>
</html>
